name: revendo
description: "Revendo — Para negocios que revenden/producen productos."
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  http: ^1.2.2
  shared_preferences: ^2.3.3
  intl: ^0.19.0
  share_plus: ^12.0.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# Ícono de la app — mismo logo en todas las plataformas.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_1024x1024.jpeg"
  min_sdk_android: 21
  remove_alpha_ios: true

# Pantalla de carga — mismo verde de marca (#16A34A) detrás del logo, que ya
# trae ese mismo verde de fondo, para que no se note la costura entre los dos.
flutter_native_splash:
  color: "#16A34A"
  image: assets/images/logo_1024x1024.jpeg
  android_12:
    image: assets/images/logo_1024x1024.jpeg
    color: "#16A34A"

# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true

  assets:
    - assets/images/